<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Helix</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/helix.css" />
</head>
<body>
<main class="hx-shell hx-main">

  <div class="hx-stage">
    <div class="hx-reticle" aria-hidden="true"></div>
    <div class="hx-sweep" aria-hidden="true"></div>
    <div class="hx-frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <div class="hx-core">
      <h1>Helix</h1>
      <p class="hx-core__sub" id="core-sub">Reading vault</p>
    </div>

    <!-- The galaxy. Decorative to a screen reader: every number it encodes is
         also written out in the readouts below, which are real text. -->
    <canvas id="galaxy" aria-hidden="true"></canvas>

    <div class="hx-hud">
      <div class="hx-hud__corner hx-hud__corner--tl">
        <span class="hx-readout">
          <span class="hx-readout__key">Vault</span>
          <span class="hx-readout__value" id="hud-nodes">—</span>
        </span>
        <span class="hx-readout">
          <span class="hx-readout__key">Links</span>
          <span class="hx-readout__value" id="hud-links">—</span>
        </span>
        <span class="hx-readout">
          <span class="hx-readout__key">Clusters</span>
          <span class="hx-readout__value" id="hud-groups">—</span>
        </span>
        <span class="hx-readout">
          <span class="hx-readout__key">Unlinked</span>
          <span class="hx-readout__value hx-readout__value--sm" id="hud-orphans">—</span>
        </span>
      </div>

      <div class="hx-hud__corner hx-hud__corner--tr">
        <span class="hx-readout">
          <span class="hx-readout__key">Local time</span>
          <span class="hx-readout__value" id="hud-clock">—</span>
        </span>
        <span class="hx-readout">
          <span class="hx-readout__key">Origin</span>
          <span class="hx-readout__value hx-readout__value--sm" id="hud-origin">—</span>
        </span>
      </div>

      <div class="hx-hud__corner hx-hud__corner--bl">
        <span class="hx-readout__key">Subsystems</span>
        <span class="hx-signal" id="sig-gmail" data-state="unknown">Gmail</span>
        <span class="hx-signal" id="sig-youtube" data-state="unknown">YouTube</span>
        <span class="hx-signal" id="sig-generators" data-state="unknown">Generators</span>
        <span class="hx-signal" id="sig-voice" data-state="unknown">Voice</span>
        <span class="hx-signal" id="sig-mind" data-state="unknown">Mind</span>
      </div>

      <div class="hx-hud__corner hx-hud__corner--br">
        <span class="hx-readout">
          <span class="hx-readout__key">Link</span>
          <span class="hx-readout__value hx-readout__value--sm" id="hud-link">Connecting</span>
        </span>
        <span class="hx-readout">
          <span class="hx-readout__key">Network</span>
          <span class="hx-readout__value hx-readout__value--sm">Private only</span>
        </span>
      </div>
    </div>

    <div class="hx-tech-strip">
      <span class="hx-tech" id="tech-sync">Sync —</span>
      <span class="hx-tech-rule" aria-hidden="true"></span>
      <span class="hx-tech" id="tech-latency">— ms</span>
      <span class="hx-tech-rule" aria-hidden="true"></span>
      <span class="hx-tech" id="tech-uptime">Up 00:00:00</span>
    </div>
  </div>

  <div class="hx-console">
    <nav class="hx-tabs">
      <button class="hx-tab active" data-panel="note-panel">Note</button>
      <button class="hx-tab" data-panel="gen-panel">Generate</button>
      <button type="button" class="hx-cmd-open" id="cmd-open">
        <span class="hx-cmd-open__key">Ctrl K</span> Console
      </button>
    </nav>
    <div class="hx-activity" id="activity" hidden aria-hidden="true"></div>

    <section class="hx-panel" id="note-panel">
      <label class="hx-label" for="note">Capture to vault</label>
      <textarea class="hx-field" id="note" placeholder="Anything you want to remember."></textarea>
      <div class="hx-row">
        <button class="hx-btn" id="save">Save to vault</button>
      </div>
      <div class="hx-status" id="note-status"></div>
    </section>

    <section class="hx-panel" id="gen-panel" hidden>
      <label class="hx-label" for="prompt">Prompt</label>
      <textarea class="hx-field" id="prompt" placeholder="a lighthouse on a cliff at dusk">a lighthouse on a cliff at dusk</textarea>

      <div class="hx-row">
        <div>
          <label class="hx-label" for="mode">Type</label>
          <select class="hx-field" id="mode">
            <option value="image">Image</option>
            <option value="video">Video (GIF)</option>
          </select>
        </div>
        <div>
          <label class="hx-label" for="steps">Steps</label>
          <input class="hx-field" id="steps" type="number" value="20" min="1" max="100" />
        </div>
        <div>
          <label class="hx-label" for="seed">Seed — blank is random</label>
          <input class="hx-field" id="seed" type="number" placeholder="random" />
        </div>
      </div>

      <div class="hx-row">
        <button class="hx-btn" id="go">Generate</button>
      </div>
      <div class="hx-status" id="status"></div>
      <div class="hx-result" id="result"></div>
    </section>
  </div>

</main>

<div class="hx-cmd" id="cmd" hidden>
  <div class="hx-cmd__scrim" id="cmd-scrim"></div>
  <div class="hx-cmd__panel" role="dialog" aria-modal="true" aria-label="Command console">
    <div class="hx-cmd__head">
      <span class="hx-cmd__prompt" aria-hidden="true">&gt;</span>
      <input
        class="hx-cmd__input"
        id="cmd-input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Command"
        placeholder="Type a command, or part of a note name"
      />
      <span class="hx-tech" aria-hidden="true">Esc</span>
    </div>
    <ul class="hx-cmd__list" id="cmd-list" role="listbox" aria-label="Results"></ul>
    <div class="hx-cmd__out" id="cmd-out" hidden></div>
    <div class="hx-cmd__foot">
      <span class="hx-tech">↑ ↓ Move</span>
      <span class="hx-tech">↵ Run</span>
      <span class="hx-tech">Net = reaches the network</span>
    </div>
  </div>
</div>

<script src="/galaxy.js"></script>
<script src="/app.js"></script>
<script src="/console.js"></script>
</body>
</html>
