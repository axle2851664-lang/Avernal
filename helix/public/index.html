<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Helix</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/helix.css" />
</head>
<body>
<!--
  One screen, one focal point.

  Permanently on it: the sphere, the wordmark, one line saying what Helix is
  doing, one status dot, and the two ways in — voice and the command console.
  Nothing else. Replies appear under the wordmark and leave again once read.

  The counts, clock, latency, uptime and per-subsystem states are all still
  measured; ACTIVITY in the console reports them. They are off the wall, not
  gone.
-->
<main class="hx-shell hx-main">

  <div class="hx-stage" id="stage" data-state="idle">
    <!-- The galaxy. Decorative to a screen reader: what it encodes is also
         written out in the state line, which is real text. -->
    <canvas id="galaxy" aria-hidden="true"></canvas>

    <div class="hx-core">
      <h1>Helix</h1>
      <!-- One line, and it says only what is true right now: what the system
           is doing, or that it is doing nothing. -->
      <p class="hx-core__state" id="core-state" role="status">Reading vault</p>
      <!-- The reply. Absent until there is one, gone once it has been read.
           The note under it carries where the answer came from and anything
           that was kept, so the console does not have to say it again. -->
      <div class="hx-reply" id="reply" hidden>
        <p class="hx-reply__text" id="reply-text"></p>
        <p class="hx-reply__note" id="reply-note" hidden></p>
      </div>
    </div>

    <!-- Status on one side, the two ways in on the other. That is the whole
         permanent interface. -->
    <div class="hx-hud">
      <span class="hx-signal" id="system" data-state="unknown">Connecting</span>

      <div class="hx-controls">
        <button type="button" class="hx-control" id="mic" aria-pressed="false">
          <svg class="hx-control__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="6" y="2" width="4" height="8" rx="2" />
            <path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14" />
          </svg>
          <span class="hx-control__text">Voice</span>
        </button>

        <button type="button" class="hx-control" id="cmd-open">
          <span class="hx-control__key">Ctrl K</span>
          <span class="hx-control__text">Command</span>
        </button>
      </div>
    </div>

    <div class="hx-activity" id="activity" hidden aria-hidden="true"></div>
  </div>

  <!-- The controls. Out of the way until asked for, by OPEN NOTE / OPEN
       GENERATE in the console or by the button above. -->
  <div class="hx-sheet" id="sheet" hidden>
    <div class="hx-sheet__head">
      <span class="hx-label" id="sheet-title">Note</span>
      <button type="button" class="hx-sheet__close" id="sheet-close" aria-label="Close">Esc</button>
    </div>

    <section class="hx-panel" id="note-panel">
      <label class="hx-label" for="note">Capture to vault</label>
      <textarea class="hx-field" id="note" placeholder="Anything you want to remember."></textarea>
      <div class="hx-row">
        <button class="hx-btn" id="save">Save to vault</button>
      </div>
      <div class="hx-status" id="note-status"></div>
    </section>

    <section class="hx-panel" id="gen-panel" hidden>
      <label class="hx-label" for="prompt">Prompt</label>
      <textarea class="hx-field" id="prompt" placeholder="a lighthouse on a cliff at dusk">a lighthouse on a cliff at dusk</textarea>

      <div class="hx-row">
        <div>
          <label class="hx-label" for="mode">Type</label>
          <select class="hx-field" id="mode">
            <option value="image">Image</option>
            <option value="video">Video (GIF)</option>
          </select>
        </div>
        <div>
          <label class="hx-label" for="steps">Steps</label>
          <input class="hx-field" id="steps" type="number" value="20" min="1" max="100" />
        </div>
        <div>
          <label class="hx-label" for="seed">Seed — blank is random</label>
          <input class="hx-field" id="seed" type="number" placeholder="random" />
        </div>
      </div>

      <div class="hx-row">
        <button class="hx-btn" id="go">Generate</button>
      </div>
      <div class="hx-status" id="status"></div>
      <div class="hx-result" id="result"></div>
    </section>
  </div>

</main>

<div class="hx-cmd" id="cmd" hidden>
  <div class="hx-cmd__scrim" id="cmd-scrim"></div>
  <div class="hx-cmd__panel" role="dialog" aria-modal="true" aria-label="Command console">
    <div class="hx-cmd__head">
      <span class="hx-cmd__prompt" aria-hidden="true">&gt;</span>
      <input
        class="hx-cmd__input"
        id="cmd-input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Command"
        placeholder="Type a command, or part of a note name"
      />
      <span class="hx-tech" aria-hidden="true">Esc</span>
    </div>
    <ul class="hx-cmd__list" id="cmd-list" role="listbox" aria-label="Results"></ul>
    <div class="hx-cmd__out" id="cmd-out" hidden></div>
    <div class="hx-cmd__foot">
      <span class="hx-tech">↑ ↓ Move</span>
      <span class="hx-tech">↵ Run</span>
    </div>
  </div>
</div>

<script src="/galaxy.js"></script>
<script src="/app.js"></script>
<script src="/console.js"></script>
</body>
</html>
