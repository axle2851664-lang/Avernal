<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Helix</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/helix.css" />
</head>
<body>
<main class="hx-shell">
  <header class="hx-head">
    <div class="hx-head__mark">
      <h1>Helix</h1>
      <span class="hx-head__rule" aria-hidden="true"></span>
    </div>
    <p class="hx-sub">Served from the same origin as the API, so nothing here depends on cross-origin access.</p>
  </header>

  <nav class="hx-tabs">
    <button class="hx-tab active" data-panel="note-panel">Note</button>
    <button class="hx-tab" data-panel="gen-panel">Generate</button>
  </nav>

  <section class="hx-panel" id="note-panel">
    <label class="hx-label" for="note">Note</label>
    <textarea class="hx-field" id="note" placeholder="Anything you want to remember."></textarea>
    <div class="hx-row">
      <button class="hx-btn" id="save">Save to vault</button>
    </div>
    <div class="hx-status" id="note-status"></div>
  </section>

  <section class="hx-panel" id="gen-panel" hidden>
    <label class="hx-label" for="prompt">Prompt</label>
    <textarea class="hx-field" id="prompt" placeholder="a lighthouse on a cliff at dusk">a lighthouse on a cliff at dusk</textarea>

    <div class="hx-row">
      <div>
        <label class="hx-label" for="mode">Type</label>
        <select class="hx-field" id="mode">
          <option value="image">Image</option>
          <option value="video">Video (GIF)</option>
        </select>
      </div>
      <div>
        <label class="hx-label" for="steps">Steps</label>
        <input class="hx-field" id="steps" type="number" value="20" min="1" max="100" />
      </div>
      <div>
        <label class="hx-label" for="seed">Seed — blank is random</label>
        <input class="hx-field" id="seed" type="number" placeholder="random" />
      </div>
    </div>

    <div class="hx-row">
      <button class="hx-btn" id="go">Generate</button>
    </div>
    <div class="hx-status" id="status"></div>
    <div class="hx-result" id="result"></div>
  </section>
</main>

<script>
  const el = (id) => document.getElementById(id);

  document.querySelectorAll('.hx-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.hx-tab').forEach((t) => t.classList.toggle('active', t === tab));
      for (const id of ['note-panel', 'gen-panel']) el(id).hidden = id !== tab.dataset.panel;
    });
  });

  el('save').addEventListener('click', async () => {
    const text = el('note').value.trim();
    const out = el('note-status');
    const show = (msg, bad) => { out.textContent = msg; out.classList.toggle('error', Boolean(bad)); };

    if (!text) { show('Write something first.', true); return; }

    el('save').disabled = true;
    show('Saving...');
    try {
      const res = await fetch('/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      if (!res.ok) { show(data.details || data.error || 'Could not save.', true); return; }
      show('Saved as "' + data.title + '".');
      el('note').value = '';
    } catch (err) {
      show('Could not reach the server: ' + err.message, true);
    } finally {
      el('save').disabled = false;
    }
  });
  const status = el('status');
  const result = el('result');

  function setStatus(text, isError) {
    status.textContent = text;
    status.classList.toggle('error', Boolean(isError));
  }

  el('go').addEventListener('click', async () => {
    const prompt = el('prompt').value.trim();
    if (!prompt) {
      setStatus('Enter a prompt first.', true);
      return;
    }

    const mode = el('mode').value;
    const steps = Number(el('steps').value) || undefined;
    const seedRaw = el('seed').value.trim();

    const body = { prompt };
    if (steps !== undefined) body.steps = steps;
    if (seedRaw !== '') body.seed = Number(seedRaw);

    el('go').disabled = true;
    result.innerHTML = '';
    setStatus(
      'Generating. The first run downloads about 5GB of model weights, and on CPU a single image takes several minutes.'
    );

    try {
      const res = await fetch('/generate/' + mode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (!res.ok || data.success === false) {
        setStatus(data.details || data.error || 'Generation failed.', true);
        return;
      }

      setStatus('Done in ' + (data.device || 'unknown') + ' mode.');
      const img = document.createElement('img');
      // Cache-bust so regenerating with the same seed does not show the old file.
      img.src = data.url + '?t=' + Date.now();
      img.alt = data.prompt || prompt;
      result.appendChild(img);

      const meta = document.createElement('div');
      meta.className = 'hx-meta';
      meta.textContent = 'seed ' + data.seed + ' · ';
      const link = document.createElement('a');
      link.href = data.url;
      link.textContent = data.filename;
      meta.appendChild(link);
      result.appendChild(meta);
    } catch (err) {
      setStatus('Could not reach the server: ' + err.message, true);
    } finally {
      el('go').disabled = false;
    }
  });
</script>
</body>
</html>
